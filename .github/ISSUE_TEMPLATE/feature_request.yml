name: Feature request
description: Suggest an improvement for Lumo.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or friction you want Lumo to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any current workaround or other approach you tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS app
        - PopClip integration
        - Provider support
        - Translation behavior
        - History
        - Text-to-speech
        - Updates/install
        - Other
