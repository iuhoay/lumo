name: Release

on:
  push:
    # Three components only (v0.2.4). Two-component tags (v1.0) are
    # PopClip directory submissions; see popclip-directory.yaml.
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the build number (commit count) is monotonic across
          # releases — Sparkle compares CFBundleVersion to detect a newer build.
          fetch-depth: 0

      # The release logic lives in bin/release (shellcheck-lintable, runnable
      # locally); each step is a thin call so secrets stay scoped per step.
      - name: Build and package
        run: bin/release build

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bin/release appcast

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/release publish
